<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RSVP Speed Reader</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    html, body {
      height: 100vh;
      overflow: hidden;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      touch-action: manipulation;
    }
    header { background: #1e293b; padding: 1rem; text-align: center; font-size: 1.25rem; font-weight: bold; border-bottom: 1px solid #334155; }
    .container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1.5rem; text-align: center; }
    .controls { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; margin-bottom: 2rem; width: 100%; max-width: 500px; }
    input[type="file"] { display: none; }
    .btn { background: #3b82f6; color: white; padding: 0.75rem 1.25rem; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; }
    .btn:active { opacity: 0.8; }
    .btn-secondary { background: #475569; }
    .reader-box { background: #1e293b; width: 100%; max-width: 500px; height: 160px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 2.25rem; font-weight: bold; position: relative; border: 2px solid #334155; }
    .orp-highlight { color: #ef4444; text-decoration: underline; }
    .slider-group { display: flex; align-items: center; gap: 1rem; margin-top: 1.5rem; width: 100%; max-width: 500px; }
    .slider-group label { font-size: 0.9rem; color: #94a3b8; }
    input[type="range"] { flex: 1; }
    .status { margin-top: 1rem; color: #94a3b8; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>⚡ RSVP Speed Reader</header>

  <div class="container">
    <div class="controls">
      <label class="btn btn-secondary">
        📁 Open PDF
        <input type="file" id="pdfInput" accept="application/pdf">
      </label>
      <button class="btn" id="playBtn">Play / Pause</button>
      <button class="btn btn-secondary" id="restartBtn">Restart</button>
    </div>

    <div class="reader-box" id="wordDisplay">
      <span>Upload PDF</span>
    </div>

    <div class="slider-group">
      <label>Speed:</label>
      <input type="range" id="wpmSlider" min="100" max="2000" step="25" value="300">
      <span id="wpmValue">300 WPM</span>
    </div>

    <div class="status" id="statusText">No PDF loaded</div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let words = [];
    let currentIndex = 0;
    let isPlaying = false;
    let timer = null;
    let wpm = 300;

    const pdfInput = document.getElementById('pdfInput');
    const wordDisplay = document.getElementById('wordDisplay');
    const playBtn = document.getElementById('playBtn');
    const restartBtn = document.getElementById('restartBtn');
    const wpmSlider = document.getElementById('wpmSlider');
    const wpmValue = document.getElementById('wpmValue');
    const statusText = document.getElementById('statusText');

    pdfInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusText.textContent = "Loading PDF...";
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

      let extractedText = "";
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        const pageText = textContent.items.map(item => item.str).join(" ");
        extractedText += " " + pageText;
      }

      words = extractedText.trim().split(/\s+/).filter(w => w.length > 0);
      currentIndex = 0;
      statusText.textContent = `Loaded ${words.length} words.`;
      displayCurrentWord();
    });

    wpmSlider.addEventListener('input', (e) => {
      wpm = parseInt(e.target.value);
      wpmValue.textContent = `${wpm} WPM`;
      if (isPlaying) {
        stopReading();
        startReading();
      }
    });

    playBtn.addEventListener('click', togglePlayPause);

    restartBtn.addEventListener('click', () => {
      stopReading();
      currentIndex = 0;
      displayCurrentWord();
    });

    function togglePlayPause() {
      if (words.length === 0) return;
      if (isPlaying) {
        stopReading();
      } else {
        startReading();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.keyCode === 32) {
        e.preventDefault();
        togglePlayPause();
      }
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
        e.preventDefault();
      }
      if (e.code === 'ArrowLeft' && words.length > 0) {
        currentIndex = Math.max(0, currentIndex - 10);
        displayCurrentWord();
      }
      if (e.code === 'ArrowRight' && words.length > 0) {
        currentIndex = Math.min(words.length - 1, currentIndex + 10);
        displayCurrentWord();
      }
    });

    function startReading() {
      if (currentIndex >= words.length) currentIndex = 0;
      isPlaying = true;
      playBtn.textContent = "Pause";
      const interval = (60 / wpm) * 1000;
      timer = setInterval(() => {
        if (currentIndex < words.length) {
          displayCurrentWord();
          currentIndex++;
        } else {
          stopReading();
        }
      }, interval);
    }

    function stopReading() {
      isPlaying = false;
      playBtn.textContent = "Play";
      clearInterval(timer);
    }

    function displayCurrentWord() {
      if (words.length === 0 || currentIndex >= words.length) return;
      const word = words[currentIndex];
      const mid = Math.floor(word.length / 2);
      const start = word.slice(0, mid);
      const focal = word[mid] || "";
      const end = word.slice(mid + 1);

      wordDisplay.innerHTML = `${start}<span class="orp-highlight">${focal}</span>${end}`;
    }
  </script>
</body>
</html>
